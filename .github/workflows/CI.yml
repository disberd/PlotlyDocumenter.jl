name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # PlotlyJS holds JSON at 0.21 through WebIO, so it cannot share an
      # environment with the JSON v1 the default test target resolves. Run the
      # suite a second time with PlotlyJS present to cover the 0.21 path and
      # the PlotlyJS extension.
      - name: Test with PlotlyJS
        run: |
          julia --project=@plotlyjs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.add(["PlotlyJS", "PlotlyBase", "PlotlyLight", "Test"])
            include(joinpath(pwd(), "test", "runtests.jl"))'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
